name: mcp-production-smoke

on:
  push:
    branches: [main]
    paths:
      - 'api/mcp.py'
      - 'api/lib/**'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/mcp-production-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MCP client
        run: python -m pip install 'mcp==2.2.0'

      - name: Wait for Vercel production and run upstream smoke
        shell: bash
        run: |
          cat >/tmp/mcp_smoke.py <<'PY'
          import asyncio
          import sys

          from mcp import Client

          URL = "https://newwords-discovery.vercel.app/api/mcp"

          async def main():
              async with Client(URL) as client:
                  listed = await client.list_tools()
                  names = {tool.name for tool in listed.tools}
                  expected = {
                      "get_trending_keywords",
                      "get_trending_now",
                      "get_keyword_volume",
                  }
                  missing = expected - names
                  if missing:
                      print(f"deployment not ready; missing MCP tools: {sorted(missing)}")
                      raise SystemExit(75)

                  for country_code in ("US", "IN", "BR"):
                      realtime = await client.call_tool(
                          "get_trending_now",
                          {
                              "country_code": country_code,
                              "hours": 4,
                              "limit": 1,
                          },
                      )
                      if realtime.is_error or not realtime.structured_content:
                          raise RuntimeError(
                              f"Trending Now smoke failed for {country_code}: "
                              f"{realtime.content}"
                          )
                      results = realtime.structured_content.get("results") or []
                      if not results:
                          raise RuntimeError(
                              f"Trending Now returned no 4h results for {country_code}"
                          )

                  trends = await client.call_tool(
                      "get_trending_keywords",
                      {"kind": "rising", "country_code": "US", "limit": 1},
                  )
                  if trends.is_error or not trends.structured_content:
                      raise RuntimeError(f"trends smoke failed: {trends.content}")

                  volume = await client.call_tool(
                      "get_keyword_volume",
                      {"keywords": ["i ching online"]},
                  )
                  if volume.is_error or not volume.structured_content:
                      raise RuntimeError(f"volume smoke failed: {volume.content}")

                  print("MCP production smoke passed")
                  print(f"tools={sorted(names)}")
                  print("trending_now_countries=US,IN,BR")

          asyncio.run(main())
          PY

          for attempt in $(seq 1 36); do
            echo "MCP smoke attempt $attempt/36"
            set +e
            python /tmp/mcp_smoke.py
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              exit 0
            fi

            if [ "$code" -eq 75 ]; then
              sleep 10
              continue
            fi

            echo "MCP production smoke reached the new deployment but upstream validation failed" >&2
            exit "$code"
          done

          echo "MCP production deployment did not expose the expected tools before timeout" >&2
          exit 1
