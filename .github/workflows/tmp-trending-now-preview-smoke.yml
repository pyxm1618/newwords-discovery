name: tmp-trending-now-preview-smoke

on:
  push:
    branches: [feat/trending-now-rpc]
    paths: [.github/workflows/tmp-trending-now-preview-smoke.yml]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose preview accessibility
        shell: bash
        run: |
          URL='https://newwords-discovery-frkt3449o-pyxm1618s-projects.vercel.app/api/mcp'
          echo '=== GET ==='
          curl -sS -D /tmp/get.headers -o /tmp/get.body --max-time 20 "$URL" || true
          cat /tmp/get.headers
          head -c 1000 /tmp/get.body || true
          echo
          echo '=== POST initialize ==='
          cat >/tmp/init.json <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"preview-diagnostic","version":"1.0"}}}
          JSON
          curl -sS -D /tmp/post.headers -o /tmp/post.body --max-time 20 \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data-binary @/tmp/init.json || true
          cat /tmp/post.headers
          cat /tmp/post.body
