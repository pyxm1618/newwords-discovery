name: temp-opportunity-variant-volume

on:
  pull_request:

jobs:
  run:
    if: github.head_ref == 'chore/global-month-skill-run-20260920'
    runs-on: ubuntu-latest
    steps:
      - name: Check evidence-backed derivative query volumes
        shell: bash
        env:
          SEO_DATA_API_KEY: ${{ secrets.SEO_DATA_API_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SEO_DATA_API_KEY"
          call () {
            label="$1"; geo="$2"; kws="$3"
            status="$(curl -sS -o "/tmp/$label.json" -w '%{http_code}' \
              -X POST 'https://newwords-discovery.vercel.app/api/v1/keyword-volume' \
              -H "Authorization: Bearer $SEO_DATA_API_KEY" \
              -H 'Content-Type: application/json' \
              --data "{\"keywords\":$kws,\"geo_target_constant\":\"$geo\",\"language_constant\":\"1000\",\"network\":\"GOOGLE_SEARCH\"}")"
            echo "=== $label status=$status ==="; test "$status" = 200
            python - "$label" <<'PY'
          import json,sys
          d=json.load(open("/tmp/"+sys.argv[1]+".json"))
          for r in d.get("results",[]):
              print(json.dumps({
                "keyword":r.get("keyword"),
                "avg_monthly_searches":r.get("avg_monthly_searches"),
                "competition":r.get("competition"),
                "monthly_search_volumes":r.get("monthly_search_volumes")
              },ensure_ascii=False))
          PY
          }
          call gb2 2826 '["motor finance compensation scheme","car finance compensation","dwp eligibility verification notice"]'
          call ca2 2124 '["study without study permit","work permit holders study without study permit"]'
          call za2 2710 '["home affairs bank branches","smart id branches","social grant review","sassa grant under review"]'
