name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q api
      - run: python -m json.tool vercel.json >/dev/null

      - name: Temporary authenticated production smoke
        if: github.head_ref == 'chore/prod-auth-smoke-final-20260919'
        shell: bash
        env:
          SEO_DATA_API_KEY: ${{ secrets.SEO_DATA_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SEO_DATA_API_KEY"
          echo "::add-mask::$SEO_DATA_API_KEY"

          trends_code="$(curl -sS -o /tmp/trends.json -w '%{http_code}'             -X POST 'https://newwords-discovery.vercel.app/api/v1/trends'             -H "Authorization: Bearer $SEO_DATA_API_KEY"             -H 'Content-Type: application/json'             --data '{"kind":"rising","country_code":"US","refresh_date":"2026-09-18","limit":5}')"
          echo "trends_status=$trends_code"
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/trends.json"))
          print("trends_body=" + json.dumps(data, ensure_ascii=False))
          if "error" in data:
              sys.exit(2)
          assert data.get("source") == "google_trends_bigquery"
          assert data.get("query", {}).get("country_code") == "US"
          assert data.get("query", {}).get("refresh_date") == "2026-09-18"
          assert isinstance(data.get("results"), list)
          usage = data.get("usage")
          assert isinstance(usage, dict)
          for key in ("total_bytes_processed", "total_bytes_billed", "cache_hit"):
              assert key in usage
          PY
          test "$trends_code" = "200"

          volume_code="$(curl -sS -o /tmp/volume.json -w '%{http_code}'             -X POST 'https://newwords-discovery.vercel.app/api/v1/keyword-volume'             -H "Authorization: Bearer $SEO_DATA_API_KEY"             -H 'Content-Type: application/json'             --data '{"keywords":["i ching online"],"geo_target_constant":"2840","language_constant":"1000","network":"GOOGLE_SEARCH"}')"
          echo "keyword_volume_status=$volume_code"
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/volume.json"))
          print("keyword_volume_body=" + json.dumps(data, ensure_ascii=False))
          if "error" in data:
              sys.exit(3)
          assert data.get("source") == "google_ads"
          results = data.get("results")
          assert isinstance(results, list)
          assert results and results[0].get("keyword") == "i ching online"
          PY
          test "$volume_code" = "200"
